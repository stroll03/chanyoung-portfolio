<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1140">
  <meta name="robots" content="noindex, nofollow">
  <title>김찬영 포트폴리오 · Design & Code</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-navy: #0F172A;
      --bg-card: #1E293B;
      --kakao-yellow: #FEE500;
      --kakao-yellow-dim: rgba(254, 229, 0, 0.15);
      --text-main: #F8FAFC;
      --text-sub: #CBD5E1;
      --text-muted: #94A3B8;
      --border-line: rgba(148, 163, 184, 0.25);
      --accent-blue: #38BDF8;
      --accent-green: #4ADE80;
      --accent-red: #F87171;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: var(--bg-navy);
      background-image: 
        linear-gradient(rgba(56, 189, 248, 0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(56, 189, 248, 0.06) 1px, transparent 1px);
      background-size: 28px 28px;
      color: var(--text-main);
      line-height: 1.65;
      word-break: keep-all;
      min-height: 100vh;
      min-width: 1140px;
    }

    /* 상단 네비게이션 바 */
    .top-nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-line);
      padding: 12px 24px;
    }
    .nav-inner {
      max-width: 1080px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .nav-brand {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.9rem;
      font-weight: 800;
      color: var(--kakao-yellow);
    }
    .nav-tabs {
      display: flex;
      gap: 8px;
    }
    .nav-tab {
      background: transparent;
      border: 1px solid var(--border-line);
      color: var(--text-sub);
      padding: 6px 14px;
      border-radius: 99px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      font-family: 'Noto Sans KR', sans-serif;
    }
    .nav-tab:hover {
      border-color: var(--kakao-yellow);
      color: var(--text-main);
    }
    .nav-tab.active {
      background: var(--kakao-yellow);
      color: #191919;
      border-color: var(--kakao-yellow);
    }
    .mode-btn {
      background: var(--bg-card);
      border: 1px solid var(--accent-blue);
      color: var(--accent-blue);
      padding: 6px 14px;
